name: Verificación y Reentrenamiento Automático

# FASE 10 — Ciclo MLOps completo:
#   detectar datos nuevos -> drift -> reentrenar (en borrador) -> control de calidad
#   -> respaldar modelo vigente -> publicar en S3 -> registrar en git -> redespliegue en Railway
on:
  schedule:
    - cron: '0 8 1 * *'   # 1ro de cada mes a las 8 UTC
  workflow_dispatch:
    inputs:
      forzar_reentrenamiento:
        description: "Reentrenar aunque no haya nueva versión de OpenDengue (usa el dataset de features vigente)"
        type: boolean
        default: false

concurrency:
  group: reentrenamiento
  cancel-in-progress: false

jobs:
  verificar-y-reentrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 180    # LSTM puede tardar hasta 60 min
    permissions:
      contents: write        # registrar artefactos en el repo (dispara el redespliegue)
      issues: write          # issues de alerta (drift / modelo rechazado)

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    us-east-2
      S3_BUCKET:             ${{ secrets.S3_BUCKET }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar estado vigente desde S3
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, 'agents')
          import s3_client as s3
          for d in ('data/processed', 'data/raw', 'data/models'):
              os.makedirs(d, exist_ok=True)
          archivos = [
              (s3.PREFIX_PROCESADOS + 'dataset_features_latam.csv', 'data/processed/dataset_features_latam.csv'),
              (s3.PREFIX_CRUDOS     + 'departamentos_coordenadas.csv', 'data/raw/departamentos_coordenadas.csv'),
              (s3.PREFIX_MODELOS    + 'data_version.json', 'data/models/data_version.json'),
              # Métricas del modelo en producción: referencia para el control de calidad
              (s3.PREFIX_MODELOS    + 'metrics.json', 'data/models/metrics_vigente.json'),
          ]
          for key, local in archivos:
              try:
                  s3.download(key, local)
              except Exception as e:
                  print(f'Aviso: no se pudo descargar {key}: {e}')
          EOF

      - name: Verificar nueva versión OpenDengue + drift climático
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python scripts/pipeline/verificar_actualizacion.py 2>&1 | tee check_output.txt
          if grep -q "Nueva versión detectada" check_output.txt; then
            echo "nueva_version=true" >> $GITHUB_OUTPUT
          else
            echo "nueva_version=false" >> $GITHUB_OUTPUT
          fi
          if grep -q "ALERTA" check_output.txt; then
            echo "drift_alto=true" >> $GITHUB_OUTPUT
          else
            echo "drift_alto=false" >> $GITHUB_OUTPUT
          fi
          if grep -q "Nueva versión detectada" check_output.txt || [ "${{ inputs.forzar_reentrenamiento }}" == "true" ]; then
            echo "reentrenar=true" >> $GITHUB_OUTPUT
          else
            echo "reentrenar=false" >> $GITHUB_OUTPUT
          fi

      - name: Preprocesar dataset nuevo (Agente 2, en borrador)
        if: steps.check.outputs.nueva_version == 'true'
        env:
          S3_SKIP_UPLOAD: "1"
        run: python agents/agente_2_preprocesamiento.py

      - name: Reentrenar modelos (Agentes 3, 4, 5, en borrador)
        if: steps.check.outputs.reentrenar == 'true'
        env:
          S3_SKIP_UPLOAD: "1"   # nada se publica hasta pasar el control de calidad
        run: |
          python scripts/training/entrenar_modelos.py
          python scripts/pipeline/generar_scatter_data.py
          python -c "import runpy; runpy.run_path('scripts/pipeline/verificar_actualizacion.py', run_name='lib')['actualizar_trained_at']()"

      - name: Control de calidad (nuevo vs vigente)
        id: qa
        if: steps.check.outputs.reentrenar == 'true'
        run: |
          set +e
          python scripts/pipeline/validar_modelo.py \
            --vigente data/models/metrics_vigente.json \
            --nuevo   data/models/metrics.json
          echo "Código de salida: $?"

      - name: Respaldar modelo vigente en el historial de S3
        id: respaldo
        if: steps.qa.outputs.aprobado == 'true'
        run: |
          TS=$(date -u +%Y%m%dT%H%MZ)
          aws s3 sync "s3://$S3_BUCKET/modelos/"          "s3://$S3_BUCKET/historial/$TS/modelos/"
          aws s3 sync "s3://$S3_BUCKET/datos_procesados/" "s3://$S3_BUCKET/historial/$TS/datos_procesados/"
          echo "ts=$TS" >> $GITHUB_OUTPUT
          echo "Respaldo del modelo anterior: s3://<bucket>/historial/$TS/" >> $GITHUB_STEP_SUMMARY

      - name: Publicar modelo aprobado en S3
        if: steps.qa.outputs.aprobado == 'true'
        run: |
          aws s3 sync data/models/ "s3://$S3_BUCKET/modelos/" --exclude "metrics_vigente.json"
          if [ "${{ steps.check.outputs.nueva_version }}" == "true" ]; then
            aws s3 cp data/processed/dataset_maestro_mensual_latam.csv "s3://$S3_BUCKET/datos_procesados/"
            aws s3 cp data/processed/dataset_features_latam.csv        "s3://$S3_BUCKET/datos_procesados/"
          fi

      - name: Subir drift_report y data_version a S3 (siempre)
        if: steps.check.outcome == 'success'
        run: |
          for f in drift_report.json data_version.json; do
            [ -f "data/models/$f" ] && aws s3 cp "data/models/$f" "s3://$S3_BUCKET/modelos/$f" || echo "No existe $f"
          done

      - name: Registrar en el repositorio (dispara el redespliegue en Railway)
        if: steps.check.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          for f in data/models/drift_report.json data/models/data_version.json; do
            [ -f "$f" ] && git add "$f"
          done
          if [ "${{ steps.qa.outputs.aprobado }}" == "true" ]; then
            git add data/models
            if [ "${{ steps.check.outputs.nueva_version }}" == "true" ]; then
              git add data/processed/dataset_maestro_mensual_latam.csv data/processed/dataset_features_latam.csv
            fi
            MSG="mlops: publicar modelo reentrenado (R² ensamble $(python -c "import json;print(json.load(open('data/models/metrics.json'))['r2_ensemble'])"))"
          else
            MSG="mlops: verificación mensual (drift y versión de datos)"
          fi
          if git diff --cached --quiet; then
            echo "Sin cambios que registrar."
            exit 0
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Crear issue si el modelo reentrenado fue rechazado
        if: steps.check.outputs.reentrenar == 'true' && steps.qa.outputs.aprobado != 'true'
        uses: actions/github-script@v7
        env:
          MOTIVOS: ${{ steps.qa.outputs.motivos }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: 'Modelo reentrenado rechazado por el control de calidad',
              body:  `El reentrenamiento terminó pero el modelo nuevo **no se publicó**; producción sigue con el modelo vigente.\n\nMotivos: ${process.env.MOTIVOS || 'ver el resumen del workflow'}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['model-monitoring']
            })

      - name: Crear issue si hay drift alto sin nueva versión
        if: steps.check.outputs.drift_alto == 'true' && steps.check.outputs.nueva_version == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: 'Drift climatico detectado - revisar cuando llegue nueva version OpenDengue',
              body:  '**Drift alto detectado** en features climaticas (PSI >= 0.2).\n\nEl dataset de OpenDengue no tiene nueva version aun, por lo que el reentrenamiento automatico no aplica.\nCuando OpenDengue publique nuevos datos, el drift de concepto podra evaluarse.\n\nVer `data/models/drift_report.json` para detalles.',
              labels: ['drift', 'model-monitoring']
            })

      - name: Resumen del resultado
        if: always()
        run: |
          {
            echo "### Resultado del ciclo MLOps"
            echo ""
            if [ "${{ steps.check.outputs.nueva_version }}" == "true" ]; then
              echo "🆕 Nueva versión de OpenDengue detectada"
            else
              echo "ℹ️ Sin nueva versión de OpenDengue"
            fi
            if [ "${{ steps.check.outputs.reentrenar }}" == "true" ]; then
              if [ "${{ steps.qa.outputs.aprobado }}" == "true" ]; then
                echo "✅ Modelo reentrenado **aprobado y publicado** (respaldo anterior: historial/${{ steps.respaldo.outputs.ts }})"
              else
                echo "❌ Modelo reentrenado **rechazado** — producción mantiene el modelo vigente"
              fi
            else
              echo "⏭️ Sin reentrenamiento en esta ejecución"
            fi
            if [ "${{ steps.check.outputs.drift_alto }}" == "true" ]; then
              echo "⚠️ Drift climático alto — ver drift_report.json"
            else
              echo "✅ Features climáticas estables"
            fi
          } >> $GITHUB_STEP_SUMMARY
